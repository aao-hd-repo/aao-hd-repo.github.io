		<p>Characters</p>

<script src="../styles/editableJs/common.js"></script>
<script src="../styles/editableJs/clipboard.js"></script>
<script src="../styles/editableJs/tabs.js"></script>
<script>
// Evidence icon element
class GameIcon extends HTMLElement {
	connectedCallback() {
		const game = this.getAttribute('game');
		const name = this.getAttribute('name');
		const imageUrl = `${game}/${name}.png`;

		this.innerHTML = `
			<div class="character-card">
				<img src="${imageUrl}" alt="${name}" height="192">
				<p><b>${name}</b></p>
				<button class="copyBtn">Copy URL</button>
			</div>
		`;
		
		const targetUrl = `https://aao-hd-repo.github.io/Evidence/${game}/${name}.png`;
		const btn = this.querySelector('.copyBtn');
		
		btn.addEventListener('click', (event) => {
			copyUrl(targetUrl, event.target);
		});
	}
}

customElements.define('game-icon', gameIcon);
</script>
