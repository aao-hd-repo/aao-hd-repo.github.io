<html>
<head>
	<title>AAO HD Background Repository</title>
	<link href="../styles/main.css" rel="stylesheet">
	<link href="../styles/tabs.css" rel="stylesheet">
	<link href="../styles/nav.css" rel="stylesheet">
</head>

<body>
<nav id="nav" class="nav"></nav>

<div class="nav-toggle">
	<div class="nav-toggle-bar"></div>
</div>


<div class="main-tab">
	<button class="main-tablinks" onclick="openSeries(event, 'Courtroom')">Courtrooms</button>
	<button class="main-tablinks" onclick="openSeries(event, 'PWT')" id="defaultOpen"><i>Phoenix Wright</i> Trilogy</button>
	<button class="main-tablinks" onclick="openSeries(event, 'AJT')"><i>Apollo Justice</i> Trilogy</button>
	<button class="main-tablinks" onclick="openSeries(event, 'Other')">Other games</button>
</div>


<!-- Courtrooms
-->
<div id="Courtroom" class="tab">
	<button class="tablinks italic" onclick="openGame(event, 'AA')">Ace Attorney</button>
</div>

<div id="AA" class="tabcontent">
	<div class="character-grid-header">
		<p>Full Courtrooms</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-court place="AA4" name="<i>Apollo Justice: Ace Attorney</i>"></game-court>
	</div>

	<div class="character-grid-header">
		<p>Specific Angles</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-court place="AA5 5-5 Defense" name="<i>Turnabout for Tomorrow</i><br>(Defense)"></game-court>
	</div>
</div>


<!-- Phoenix Wright Trilogy
-->
<div id="PWT" class="tab">
	<button class="tablinks italic" onclick="openGame(event, 'AA1')">Phoenix Wright: Ace Attorney</button>
</div>

<div id="AA1" class="tabcontent">
	<div class="character-grid-header">
		<p>Locations</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-place game="AA1" place="Wright and Co. Law Offices"></game-place>
		<game-place game="AA1" place="Fey and Co. Law Offices"></game-place>
		<game-place game="AA1" place="Edgeworth's Office"></game-place>
		<game-place game="AA1" place="Police HQ Entrance"></game-place>
		<game-place game="AA1" place="Global Studios Gate"></game-place>
	</div>
</div>


<!-- Apollo Justice Trilogy
-->
<div id="AJT" class="tab">
	<button class="tablinks italic" onclick="openGame(event, 'AA6')">Spirit of Justice</button>
</div>

<div id="AA6" class="tabcontent">
	<div class="character-grid-header">
		<p>Locations</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-place game="AA6" place="Doctor's Study"></game-place>
	</div>
</div>


<!-- Other Games
-->
<div id="Other" class="tab">
	<button class="tablinks italic" onclick="openGame(event, '999')">Zero Escape: 9 Hours, 9 Persons, 9 Doors</button>
</div>

<div id="999" class="tabcontent">
	<div class="character-grid-header">
		<p>Locations</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-place game="ZE - 999" place="Hospital"></game-place>
	</div>
</div>


<script src="../styles/editableJs/common.js"></script>
<script src="../styles/editableJs/clipboard.js"></script>
<script src="../styles/editableJs/tabs.js"></script>
<script src="../styles/editableJs/nav.js"></script>
<script src="../styles/editableJs/icons.js"></script>

</body>
</html>
