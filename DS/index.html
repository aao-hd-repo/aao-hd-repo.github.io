<html>
<head>
	<title>AAO DS Asset Repository</title>
	<link href="../styles/main.css" rel="stylesheet">
	<link href="../styles/tabs.css" rel="stylesheet">
	<link href="../styles/nav.css" rel="stylesheet">
</head>

<body>
<nav id="nav" class="nav"></nav>

<div class="nav-toggle">
	<div class="nav-toggle-bar"></div>
</div>


<div class="main-tab">
	<button class="main-tablinks" onclick="openSeries(event, 'chars')" id="defaultOpen">Characters</button>
	<button class="main-tablinks" onclick="openSeries(event, 'bgs')">Backgrounds</button>
</div>


<!-- Characters
-->
<div id="chars" class="tab">
	<button class="tablinks italic" onclick="openGame(event, 'char 999')">Zero Escape: 9 Hours, 9 Persons, 9 Doors</button>
</div>

<div id="char 999" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<ds-game-character game="ZE - 999" name="June"></ds-game-character>
		<ds-game-character game="ZE - 999" name="Santa"></ds-game-character>
	</div>
</div>


<!-- Backgrounds
-->
<div id="bgs" class="tab">
	<button class="tablinks italic" onclick="openGame(event, 'bgs 999')">Zero Escape: 9 Hours, 9 Persons, 9 Doors</button>
</div>

<div id="bgs 999" class="tabcontent">
	<div class="character-grid-header">
		<p>Locations</p>
		<hr>
	</div>

	<div class="character-grid">
		<ds-game-place game="ZE - 999" place="Hospital"></ds-game-place>
	</div>
</div>


<script src="../styles/editableJs/clipboard.js"></script>
<script src="../styles/editableJs/tabs.js"></script>
<script src="../styles/editableJs/nav.js"></script>
<script src="../styles/editableJs/icons.js"></script>

</body>
</html>
