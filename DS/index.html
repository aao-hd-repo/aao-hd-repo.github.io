<html>
<head>
	<title>AAO DS Asset Repository</title>
	<link href="../styles/main.css" rel="stylesheet">
	<link href="../styles/tabs.css" rel="stylesheet">
	<link href="../styles/nav.css" rel="stylesheet">
</head>

<body>
<nav id="nav" class="nav">
	<h2>Navigation</h2>
	<br>
	<ul>
		<li><a href="../Characters/">Characters Repository</a>
		<hr>
		<li><a href="../Backgrounds/">Background Repository</a>
		<hr>
		<li><a href="../Evidence/">Evidence Repository</a>
		<hr>
		<li><strong>DS-resolution Asset Repo</strong>
		<hr>
		<li><a href="../Scripts/">AAO Website Scripts</a>
		<br><br><br>
		<li><a href="https://www.aaonline.fr/player.php?trial_id=150704">Play the tutorial in AAO!</a>
	</ul>
</nav>

<div class="nav-toggle">
	<div class="nav-toggle-bar"></div>
</div>


<div class="tab">
	<button class="tablinks" onclick="openGame(event, 'chars')" id="defaultOpen">Characters</button>
	<button class="tablinks" onclick="openGame(event, 'bgs')">Backgrounds</button>
</div>

<div id="chars" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="ZE - 999" name="June"></game-character>
		<game-character game="ZE - 999" name="Santa"></game-character>
	</div>
</div>


<script src="../styles/editableJs/common.js"></script>
<script src="../styles/editableJs/clipboard.js"></script>
<script src="../styles/editableJs/tabs.js"></script>
<script>
// Character icon element
class GameCharacter extends HTMLElement {
	connectedCallback() {
		const game = this.getAttribute('game');
		const name = this.getAttribute('name');
		const type = this.getAttribute('type');
		const imageUrl = `Characters/${game}/${name}/Profile.png`;

		if (type === 'icon') {
			this.innerHTML = `
				<div class="character-card">
					<img src="${imageUrl}" alt="${name}" width="125" height="125" style="image-rendering: pixelated">
					<p><b>${name}</b></p>
					<button class="copyBtn" onclick="copyUrl('https://aao-hd-repo.github.io/DS/Characters/${game}/${name}/Profile.png', this)">Copy URL</button>
				</div>
			`;
		} else {
			this.innerHTML = `
				<div class="character-card">
					<a href="Characters/${game}/${name}">
						<img src="${imageUrl}" alt="${name}" width="125 height="125" style="image-rendering: pixelated">
						<p><b>${name}</b></p>
					</a>
				</div>
			`;
		}
	}
}

customElements.define('game-character', GameCharacter);
</script>

</body>
</html>
