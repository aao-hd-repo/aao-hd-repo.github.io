<html>
<head>
	<title>AAO HD Character Repository</title>
	<link href="../styles/main.css" rel="stylesheet">
	<link href="../styles/tabs.css" rel="stylesheet">
	<link href="../styles/nav.css" rel="stylesheet">
</head>

<body>
<nav id="nav" class="nav"></nav>

<div class="nav-toggle">
	<div class="nav-toggle-bar"></div>
</div>


<div class="main-tab">
	<button class="main-tablinks" onclick="openSeries(event, 'PWT')" id="defaultOpen"><i>Phoenix Wright</i> Trilogy</button>
	<button class="main-tablinks" onclick="openSeries(event, 'AAIC')"><i>Investigations</i> Duology</button>
	<button class="main-tablinks" onclick="openSeries(event, 'AJT')"><i>Apollo Justice</i> Trilogy</button>
	<button class="main-tablinks" onclick="openSeries(event, 'Other')">Other games</button>
</div>


<!-- Phoenix Wright Trilogy
-->
<div id="PWT" class="tab">
	<button class="tablinks" onclick="openGame(event, 'AA1')">Phoenix Wright: Ace Attorney</button>
	<button class="tablinks" onclick="openGame(event, 'AA2')">Justice for All</button>
	<button class="tablinks" onclick="openGame(event, 'AA3')">Trials & Tribulations</button>
</div>

<div id="AA1" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="AA1" name="Phoenix Wright"></game-character>
	</div>
</div>

<div id="AA2" class="tabcontent">
	<h3>Phoenix Wright: Ace Attorney - Justice for All</h3>
	<p>Game 2</p>
</div>

<div id="AA3" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="AA3" name="Godot"></game-character>
	</div>
</div>


<!-- Ace Attorney Investigations
-->
<div id="AAIC" class="tab">
	<button class="tablinks" onclick="openGame(event, 'AAI1')">Miles Edgeworth</button>
	<button class="tablinks" onclick="openGame(event, 'AAI2')">Prosecutor's Gambit</button>
</div>

<div id="AAI1" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="AAI1" name="Shih-na"></game-character>
	</div>
</div>

<div id="AAI2" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="AAI2" name="Eddie Fender"></game-character>
	</div>
</div>


<!-- Apollo Justice Trilogy
-->
<div id="AJT" class="tab">
	<button class="tablinks" onclick="openGame(event, 'AA4')">Apollo Justice: Ace Attorney</button>
</div>

<div id="AA4" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="AA4" name="Apollo Justice"></game-character>
		<game-character game="AA4" name="Trucy Wright"></game-character>
		<game-character game="AA4" name="Phoenix Wright"></game-character>
		<game-character img="AA1" img2="Phoenix Wright" game="AA4" name="Phoenix Wright (7 Years Ago)"></game-character>
		<game-character game="AA4" name="Ema Skye"></game-character>
	</div>
</div>


<!-- Other Games
-->
<div id="Other" class="tab">
	<button class="tablinks" onclick="openGame(event, '999')">Zero Escape: 9 Hours, 9 Persons, 9 Doors</button>
</div>

<div id="999" class="tabcontent">
	<div class="character-grid-header">
		<p>Characters</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character game="ZE - 999" name="June"></game-character>
		<game-character game="ZE - 999" name="Santa"></game-character>
	</div>

	<div class="character-grid-header">
		<p>Profiles</p>
		<hr>
	</div>

	<div class="character-grid">
		<game-character type="icon" game="ZE - 999" name="Junpei"></game-character>
	</div>
</div>


<script src="../styles/editableJs/common.js"></script>
<script src="../styles/editableJs/clipboard.js"></script>
<script src="../styles/editableJs/tabs.js"></script>
<script src="../styles/editableJs/nav.js"></script>
<script src="../styles/editableJs/icons.js"></script>

</body>
</html>
